name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticketflow_test
          POSTGRES_USER: ticketflow_test
          POSTGRES_PASSWORD: test-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketflow_test -d ticketflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://ticketflow_test:test-only-postgres-password@localhost:5432/ticketflow_test
      TEST_DATABASE_URL: postgresql+asyncpg://ticketflow_test:test-only-postgres-password@localhost:5432/ticketflow_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: test-only-jwt-secret-at-least-32-characters
      SEEDED_AGENT_EMAIL: test-agent@example.com
      SEEDED_AGENT_PASSWORD: TestOnlyAgent123!

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            pg_isready -h localhost -p 5432 -U ticketflow_test -d ticketflow_test && exit 0
            sleep 1
          done
          exit 1

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run focused test suite
        run: python -m pytest -q
